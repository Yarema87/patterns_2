<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>{% if feedback %}Редагування{% else %}Додавання{% endif %} відгуків</title>
</head>
<body>
    <h1>{% if feedback %}Редагування{% else %}Додавання{% endif %} відгуків</h1>
    <form method="post">
        <label for="author_id">Автор:</label><br>
        <input type="text" id="author_id" name="author_id" value="{{ feedback.author_id if feedback else '' }}" required><br><br>

        <label for="text">Текст</label><br>
        <input type="text" id="text" name="text" value="{{feedback.text if feedback else '' }}" required><br><br>

        <label for="time_submission">Час відправлення:</label><br>
        <input type="text" id="time_submission" name="time_submission" value="{{ feedback.time_submission if feedback else '' }}" required><br><br>

        <button type="submit">💾 Зберегти</button>
    </form>
    <br>
    <a href="{{ url_for('feedback.feedbacks_list') }}">⬅️ Назад до списку</a>
</body>
</html>
