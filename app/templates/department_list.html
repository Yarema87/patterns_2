<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Список відділів</title>
</head>
<body>
<a href="/"><h4>На головну</h4></a>
    <h1>Список відділів</h1>
    <a href="{{ url_for('department.create_department') }}">➕ Додати відділ</a>
    <table border="1" cellpadding="8">
        <thead>
            <tr>
                <th>ID</th>
                <th>Контакти</th>
            </tr>
        </thead>
        <tbody>
            {% for it_department in departments %}
            <tr>
                <td>{{ it_department.id }}</td>
                <td>{{ it_department.contacts }}</td>
                <td>
                    <a href="{{ url_for('department.edit_department', department_id=it_department.id) }}">✏️ Редагувати</a>
                    <form action="{{ url_for('department.delete_department', department_id=it_department.id) }}" method="post" style="display:inline;">
                        <button type="submit" onclick="return confirm('Видалити цього працівника?')">🗑️ Видалити</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
