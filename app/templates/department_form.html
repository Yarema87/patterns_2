<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>{% if department %}Редагування{% else %}Додавання{% endif %} відділу</title>
</head>
<body>
    <h1>{% if department %}Редагування{% else %}Додавання{% endif %} відділу</h1>
    <form method="post">

        <label for="contacts">Контакти</label><br>
        <input type="text" id="contacts" name="contacts" value="{{department.contacts if department else '' }}" required><br><br>

        <button type="submit">💾 Зберегти</button>
    </form>
    <br>
    <a href="{{ url_for('department.departments_list') }}">⬅️ Назад до списку</a>
</body>
</html>
