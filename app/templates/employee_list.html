<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Список працівників</title>
</head>
<body>
<a href="/"><h4>На головну</h4></a>
    <h1>Список працівників</h1>
    <a href="{{ url_for('employee.create_employee') }}">➕ Додати працівника</a>
    <table border="1" cellpadding="8">
        <thead>
            <tr>
                <th>ID</th>
                <th>Ім'я</th>
                <th>Посада</th>
                <th>Контакти</th>
            </tr>
        </thead>
        <tbody>
            {% for employee in employees %}
            <tr>
                <td>{{ employee.id }}</td>
                <td>{{ employee.name }}</td>
                <td>{{ employee.department }}</td>
                <td>{{ employee.contacts }}</td>
                <td>
                    <a href="{{ url_for('employee.edit_employee', employee_id=employee.id) }}">✏️ Редагувати</a>
                    <form action="{{ url_for('employee.delete_employee', employee_id=employee.id) }}" method="post" style="display:inline;">
                        <button type="submit" onclick="return confirm('Видалити цього працівника?')">🗑️ Видалити</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
